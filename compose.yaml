services:
  dash-db:
    image: agnohq/pgvector:18
    container_name: dash-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-ai}
      POSTGRES_PASSWORD: ${DB_PASS:-ai}
      POSTGRES_DB: ${DB_DATABASE:-ai}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - dash

  dash-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-dash}:${IMAGE_TAG:-latest}
    container_name: dash-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - RUNTIME_ENV=dev
      - AGNO_DEBUG=True
      - AGENTOS_URL=http://127.0.0.1:8000
      - PYTHONPATH=/app
      # Database
      - DB_HOST=dash-db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-ai}
      - DB_PASS=${DB_PASS:-ai}
      - DB_DATABASE=${DB_DATABASE:-ai}
      - WAIT_FOR_DB=True
      # API keys
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL_ID=${OPENROUTER_MODEL_ID:-openai/gpt-5.4}
      - OPENROUTER_FALLBACK_MODEL_IDS=${OPENROUTER_FALLBACK_MODEL_IDS:-}
      - OPENROUTER_EMBEDDING_MODEL_ID=${OPENROUTER_EMBEDDING_MODEL_ID:-openai/text-embedding-3-small}
      - OPENROUTER_EMBEDDING_DIMENSIONS=${OPENROUTER_EMBEDDING_DIMENSIONS:-1536}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_HTTP_REFERER=${OPENROUTER_HTTP_REFERER:-}
      - OPENROUTER_APP_TITLE=${OPENROUTER_APP_TITLE:-}
      - OPENROUTER_PROVIDER_JSON=${OPENROUTER_PROVIDER_JSON:-}
      - OPENROUTER_PROVIDER_BY_MODEL_JSON=${OPENROUTER_PROVIDER_BY_MODEL_JSON:-}
      - OPENROUTER_PROVIDER_SORT=${OPENROUTER_PROVIDER_SORT:-}
      - OPENROUTER_PROVIDER_ORDER=${OPENROUTER_PROVIDER_ORDER:-}
      - OPENROUTER_PROVIDER_ONLY=${OPENROUTER_PROVIDER_ONLY:-}
      - OPENROUTER_PROVIDER_IGNORE=${OPENROUTER_PROVIDER_IGNORE:-}
      - OPENROUTER_PROVIDER_QUANTIZATIONS=${OPENROUTER_PROVIDER_QUANTIZATIONS:-}
      - OPENROUTER_PROVIDER_ALLOW_FALLBACKS=${OPENROUTER_PROVIDER_ALLOW_FALLBACKS:-}
      - OPENROUTER_PROVIDER_REQUIRE_PARAMETERS=${OPENROUTER_PROVIDER_REQUIRE_PARAMETERS:-}
      - OPENROUTER_PROVIDER_DATA_COLLECTION=${OPENROUTER_PROVIDER_DATA_COLLECTION:-}
      - OPENROUTER_PROVIDER_ZDR=${OPENROUTER_PROVIDER_ZDR:-}
      - OPENROUTER_PROVIDER_ENFORCE_DISTILLABLE_TEXT=${OPENROUTER_PROVIDER_ENFORCE_DISTILLABLE_TEXT:-}
      - OPENROUTER_PROVIDER_PREFERRED_MIN_THROUGHPUT=${OPENROUTER_PROVIDER_PREFERRED_MIN_THROUGHPUT:-}
      - OPENROUTER_PROVIDER_PREFERRED_MAX_LATENCY=${OPENROUTER_PROVIDER_PREFERRED_MAX_LATENCY:-}
      - OPENROUTER_PROVIDER_MAX_PRICE=${OPENROUTER_PROVIDER_MAX_PRICE:-}
      # Slack
      - SLACK_TOKEN=${SLACK_TOKEN:-}
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET:-}
    depends_on:
      - dash-db
    networks:
      - dash
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  dash:

volumes:
  pgdata:
